name: Snapshot don tra / don can KN

# Quet don tra o runner nen; Streamlit chi doc Gist, khong quet hang tram trang Sapo.
on:
# NGẮT KẾT NỐI SAPO (01/10/2026, theo yêu cầu chủ shop: không dùng app nữa).
# Lịch tự chạy đã TẮT — không còn lượt gọi Sapo API nào từ GitHub.
# Muốn bật lại: bỏ dấu # ở dòng schedule/cron bên dưới.
  # schedule:
    # - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: returns-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Quet don tra va day Gist
        env:
          SAPO_API_KEY: ${{ secrets.SAPO_API_KEY }}
          SAPO_API_SECRET: ${{ secrets.SAPO_API_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python snapshot_returns.py
