name: Snapshot đơn trả / đơn cần KN

# Quét đơn trả (chậm ~2') CHẠY NỀN mỗi 15 phút rồi đẩy Gist -> app đọc Gist hiện TỨC THÌ.
# Có thể bấm chạy tay ở tab Actions (workflow_dispatch).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Tránh 2 lần chạy chồng nhau (mỗi lần ~2')
concurrency:
  group: returns-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Quét đơn trả + đẩy Gist
        env:
          SAPO_API_KEY: ${{ secrets.SAPO_API_KEY }}
          SAPO_API_SECRET: ${{ secrets.SAPO_API_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python snapshot_returns.py
