name: Dong bo kho dem Sapo (tang dan)

# Chi hoi Sapo phan MOI/DOI ke tu lan dong bo truoc (modified_on_min/max) — theo dung
# huong dan cua Sapo sau khi ho chan IP vi app quet lai toan bo lich su.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "orders | returns | all"
        default: "all"
      backfill:
        description: "So ngay nap lan dau (kho trong)"
        default: ""

concurrency:
  group: sapo-cache-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - name: Dong bo kho dem
        run: |
          python sync_sapo_cache.py \
            --kind "${{ github.event.inputs.kind || 'all' }}" \
            ${{ github.event.inputs.backfill && format('--backfill {0}', github.event.inputs.backfill) || '' }}
        env:
          SAPO_API_KEY: ${{ secrets.SAPO_API_KEY }}
          SAPO_API_SECRET: ${{ secrets.SAPO_API_SECRET }}
          SAPO_ACCESS_TOKEN: ${{ secrets.SAPO_ACCESS_TOKEN }}
          SAPO_COOKIE: ${{ secrets.SAPO_COOKIE }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
