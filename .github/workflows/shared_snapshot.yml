name: Shared Sapo snapshot

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: shared-sapo-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python snapshot_shared.py
        env:
          SAPO_API_KEY: ${{ secrets.SAPO_API_KEY }}
          SAPO_API_SECRET: ${{ secrets.SAPO_API_SECRET }}
          SAPO_ACCESS_TOKEN: ${{ secrets.SAPO_ACCESS_TOKEN }}
          SAPO_COOKIE: ${{ secrets.SAPO_COOKIE }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
